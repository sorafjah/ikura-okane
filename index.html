<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>お金はいくら？</title>
<style>
  :root {
    --bg: #fdf6e3;
    --surface: #fff8e7;
    --border: #e8d5a3;
    --text: #3d2c00;
    --sub: #8a6f3a;
    --correct: #4caf50;
    --accent: #e8913a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%; height: 100%;
    font-family: 'BIZ UDPGothic', 'BIZ UDGothic', sans-serif;
    background: var(--bg);
    overflow: hidden;
    touch-action: manipulation;
  }

  .screen {
    display: none; position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
  }
  .screen.active { display: flex; }

  /* ============ MAIN SCREEN ============ */
  #main-screen {
    flex-direction: column;
    align-items: stretch;
    padding: 6px 8px 4px;
    gap: 5px;
  }

  /* トグル — テンキー左に縦並び */
  #view-toggle {
    display: flex;
    flex-direction: column;
    gap: 6px;
    flex-shrink: 0;
  }
  .toggle-btn {
    padding: 7px 14px; border-radius: 20px;
    border: 2px solid var(--border); background: white;
    font-size: 13px; font-weight: bold; color: var(--sub);
    cursor: pointer; font-family: inherit;
    -webkit-tap-highlight-color: transparent;
    white-space: nowrap;
  }
  .toggle-btn.active { background: var(--accent); border-color: var(--accent); color: white; }

  /* コインエリア — flex:1 で残り全部 */
  #coins-area {
    flex: 1;
    min-height: 0;
    background: var(--surface);
    border: 2px solid var(--border);
    border-radius: 18px;
    position: relative;
    overflow: hidden;
  }

  /* バラバラ */
  #coins-area.scattered { display: block; }
  .coin-item { position: absolute; user-select: none; }
  .coin-item svg { display: block; }

  /* 整列 — 2列グリッド */
  #coins-area.aligned {
    display: grid;
    grid-template-columns: 1fr 1fr;
    align-content: start;
    gap: 0;
    padding: 8px 10px;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  .align-row {
    display: flex; align-items: center;
    gap: 5px; flex-wrap: wrap;
    padding: 5px 4px;
    border-bottom: 1px solid var(--border);
  }
  /* 奇数行（右列）の左ボーダー */
  #coins-area.aligned .align-row:nth-child(odd) {
    border-right: 1px solid var(--border);
    padding-right: 8px;
  }
  #coins-area.aligned .align-row:nth-child(even) {
    padding-left: 8px;
  }
  .align-label {
    font-size: 12px; color: var(--sub);
    min-width: 38px; text-align: right; flex-shrink: 0;
  }

  /* ============ BOTTOM AREA ============ */
  #bottom-area {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    flex-shrink: 0;
    padding: 2px 4px;
  }

  /* テンキー */
  #numpad {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 5px;
    width: min(204px, 55vw);
    flex-shrink: 0;
  }
  .num-btn {
    background: white;
    border: 2px solid var(--border);
    border-radius: 10px;
    font-size: 17px; font-weight: bold;
    color: var(--text);
    padding: 8px 0;
    cursor: pointer;
    font-family: inherit;
    -webkit-tap-highlight-color: transparent;
  }
  .num-btn:active { background: #fff0cc; transform: scale(0.91); }
  .num-btn.del { font-size: 17px; color: var(--sub); }
  .num-btn.enter {
    background: var(--accent); color: white;
    border-color: var(--accent); font-size: 13px;
  }
  .num-btn.enter:active { background: #c97020; }

  /* 答え欄 */
  #answer-block {
    display: flex; flex-direction: column;
    align-items: center; gap: 8px; flex-shrink: 0;
  }
  #answer-row { display: flex; align-items: baseline; gap: 4px; }
  #answer-display {
    font-size: 40px; font-weight: bold; color: var(--text);
    border-bottom: 3px solid var(--border);
    padding: 2px 8px;
    min-width: 120px; text-align: center;
    line-height: 1.2;
  }
  #yen-label { font-size: 26px; font-weight: bold; color: var(--sub); }

  #next-btn {
    display: none; padding: 8px 24px;
    background: var(--accent); color: white;
    border: none; border-radius: 20px;
    font-size: 15px; font-weight: bold;
    cursor: pointer; font-family: inherit;
    -webkit-tap-highlight-color: transparent;
  }
  #next-btn.show { display: block; }

  /* 歯車 */
  #gear-btn {
    position: fixed; bottom: 10px; right: 10px;
    width: 34px; height: 34px;
    background: none; border: none; cursor: pointer;
    opacity: 0.22; padding: 0;
    -webkit-tap-highlight-color: transparent; z-index: 100;
  }
  #gear-btn:hover { opacity: 0.5; }

  /* ============ FEEDBACK ============ */
  #feedback {
    position: fixed; top: 0; left: 0;
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    pointer-events: none; z-index: 200;
  }
  #feedback-maru {
    font-size: 200px; line-height: 1;
    color: var(--correct);
    opacity: 0; transform: scale(0.3);
  }
  #feedback-maru.show { animation: pop-maru 1.5s ease forwards; }
  @keyframes pop-maru {
    0%   { opacity: 0; transform: scale(0.3); }
    18%  { opacity: 1; transform: scale(1.3); }
    50%  { opacity: 1; transform: scale(1.0); }
    75%  { opacity: 1; transform: scale(1.08); }
    100% { opacity: 0; transform: scale(2.4); }
  }

  /* ============ SETTINGS SCREEN ============ */
  #settings-screen {
    flex-direction: column; align-items: center;
    padding: 18px 14px; gap: 12px; overflow-y: auto;
  }
  #settings-title { font-size: 20px; font-weight: bold; color: var(--text); }
  .settings-card {
    width: 100%; max-width: 520px;
    background: var(--surface);
    border: 2px solid var(--border); border-radius: 16px;
    padding: 12px 14px;
  }
  .settings-card h3 { font-size: 13px; color: var(--sub); margin-bottom: 10px; }
  .setting-row {
    display: flex; align-items: center;
    justify-content: space-between;
    padding: 6px 0; border-bottom: 1px solid var(--border); gap: 8px;
  }
  .setting-row:last-child { border-bottom: none; }
  .setting-label {
    display: flex; align-items: center;
    gap: 7px; font-size: 14px; font-weight: bold; color: var(--text);
  }
  .setting-controls { display: flex; align-items: center; gap: 3px; }
  .step-btn {
    width: 30px; height: 30px; border-radius: 50%;
    border: 2px solid var(--border); background: white;
    font-size: 17px; cursor: pointer; font-family: inherit; color: var(--text);
    display: flex; align-items: center; justify-content: center;
    -webkit-tap-highlight-color: transparent;
  }
  .step-btn:active { background: #fff0cc; }
  .range-label { font-size: 12px; color: var(--sub); margin: 0 3px; white-space: nowrap; }
  .count-val {
    font-size: 16px; font-weight: bold; color: var(--text);
    min-width: 20px; text-align: center;
  }
  #back-btn {
    padding: 10px 44px;
    background: var(--accent); color: white;
    border: none; border-radius: 22px;
    font-size: 16px; font-weight: bold;
    cursor: pointer; font-family: inherit;
  }
</style>
</head>
<body>

<!-- ===== MAIN ===== -->
<div id="main-screen" class="screen active">

  <div id="coins-area" class="scattered"></div>

  <div id="bottom-area">
    <div id="view-toggle">
      <button class="toggle-btn active" id="btn-scatter" onclick="setView('scattered')">バラバラ</button>
      <button class="toggle-btn"        id="btn-align"   onclick="setView('aligned')">せいれつ</button>
    </div>
    <div id="numpad">
      <button class="num-btn" onclick="numInput('7')">7</button>
      <button class="num-btn" onclick="numInput('8')">8</button>
      <button class="num-btn" onclick="numInput('9')">9</button>
      <button class="num-btn" onclick="numInput('4')">4</button>
      <button class="num-btn" onclick="numInput('5')">5</button>
      <button class="num-btn" onclick="numInput('6')">6</button>
      <button class="num-btn" onclick="numInput('1')">1</button>
      <button class="num-btn" onclick="numInput('2')">2</button>
      <button class="num-btn" onclick="numInput('3')">3</button>
      <button class="num-btn del"   onclick="numDel()">⌫</button>
      <button class="num-btn"       onclick="numInput('0')">0</button>
      <button class="num-btn enter" onclick="checkAnswer()">こたえる</button>
    </div>
    <div id="answer-block">
      <div id="answer-row">
        <div id="answer-display"><span id="answer-text">　</span></div>
        <div id="yen-label">円</div>
      </div>
      <button id="next-btn" onclick="nextQuestion()">つぎへ</button>
    </div>
  </div>
</div>

<!-- ===== SETTINGS ===== -->
<div id="settings-screen" class="screen">
  <div id="settings-title">⚙️ せってい</div>
  <div class="settings-card">
    <h3>金種ごとに「最小枚数」と「最大枚数」を設定</h3>
    <div id="settings-rows"></div>
  </div>
  <button id="back-btn" onclick="closeSettings()">もどる</button>
</div>

<!-- 歯車 -->
<button id="gear-btn" onclick="openSettings()">
  <svg viewBox="0 0 24 24" fill="none" stroke="#666" stroke-width="1.8" width="34" height="34">
    <circle cx="12" cy="12" r="3"/>
    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
  </svg>
</button>

<!-- フィードバック -->
<div id="feedback">
  <div id="feedback-maru">〇</div>
</div>

<script>
const DENOMS = [
  { val: 1,    label: '1円',    type: 'coin' },
  { val: 5,    label: '5円',    type: 'coin' },
  { val: 10,   label: '10円',   type: 'coin' },
  { val: 50,   label: '50円',   type: 'coin' },
  { val: 100,  label: '100円',  type: 'coin' },
  { val: 500,  label: '500円',  type: 'coin' },
  { val: 1000, label: '1000円', type: 'note' },
];

let ranges = {
  1:    { min: 0, max: 0 },
  5:    { min: 0, max: 0 },
  10:   { min: 0, max: 4 },
  50:   { min: 0, max: 2 },
  100:  { min: 0, max: 3 },
  500:  { min: 0, max: 1 },
  1000: { min: 0, max: 0 },
};

let currentAnswer = '';
let correctAmount = 0;
let answered = false;
let viewMode = 'scattered';

/* ===== SVG生成 =====
   数字を大きく・5円50円は穴を避けて上部に配置
*/
function coinSVG(val, size) {
  const C = {
    1:   { bg:'#b2b2b2', inner:'#d0d0d0', rim:'#444444', text:'1',   hole:false },
    5:   { bg:'#c8a84b', inner:'#e0c060', rim:'#5a3a00', text:'5',   hole:true  },
    10:  { bg:'#b87333', inner:'#d4946a', rim:'#4a1800', text:'10',  hole:false },
    50:  { bg:'#b0b0b0', inner:'#d0d0d0', rim:'#333333', text:'50',  hole:true  },
    100: { bg:'#a8a8a8', inner:'#c8c8c8', rim:'#2a2a2a', text:'100', hole:false },
    500: { bg:'#a0a8b0', inner:'#c0c8d0', rim:'#1a3060', text:'500', hole:false },
  };
  const c = C[val];
  const r = size / 2;
  const holeR = size * 0.11; // 穴の半径

  // 数字サイズ: より大きく
  const ts = val >= 100 ? size * 0.26
           : val >= 10  ? size * 0.30
           :              size * 0.36;

  // 5円・50円: 穴(中央)を避けて上部に配置
  // 穴の上端 = r - holeR。余白を少し取ってその上に収める。
  // 他: 中央配置
  let textY;
  if (c.hole) {
    // 上部 1/3 付近に文字中心を置く
    textY = r * 0.52 + ts * 0.38;
  } else {
    textY = r + ts * 0.38;
  }

  const hole = c.hole
    ? `<circle cx="${r}" cy="${r}" r="${holeR}" fill="#fff8e7" stroke="${c.rim}" stroke-width="1.2"/>`
    : '';

  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" xmlns="http://www.w3.org/2000/svg">
  <circle cx="${r}" cy="${r}" r="${r-1}" fill="${c.rim}"/>
  <circle cx="${r}" cy="${r}" r="${r-3}" fill="${c.bg}"/>
  <circle cx="${r}" cy="${r}" r="${r-5}" fill="${c.inner}" opacity="0.5"/>
  ${hole}
  <text x="${r}" y="${textY}" text-anchor="middle"
    font-size="${ts}" font-weight="900"
    fill="${c.rim}" font-family="BIZ UDPGothic,sans-serif">${c.text}</text>
</svg>`;
}

function noteSVG(val, w, h) {
  const bg = '#e8d9b8'; const border = '#b09060'; const inner = '#f5ead0';
  const ts = h * 0.36;
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">
  <rect x="1" y="1" width="${w-2}" height="${h-2}" rx="5" fill="${border}"/>
  <rect x="3" y="3" width="${w-6}" height="${h-6}" rx="4" fill="${bg}"/>
  <rect x="6" y="6" width="${w-12}" height="${h-12}" rx="3" fill="${inner}" opacity="0.5"/>
  <circle cx="${w*0.5}" cy="${h*0.5}" r="${h*0.27}" fill="${border}" opacity="0.15"/>
  <text x="${w*0.5}" y="${h*0.60}" text-anchor="middle"
    font-size="${ts}" font-weight="900"
    fill="${border}" font-family="BIZ UDPGothic,sans-serif">1000</text>
</svg>`;
}

/* ===== 問題生成 ===== */
function generateQuestion() {
  correctAmount = 0;
  const items = [];
  for (const d of DENOMS) {
    const r = ranges[d.val];
    if (r.max === 0 && r.min === 0) continue;
    const mn = Math.min(r.min, r.max);
    const mx = Math.max(r.min, r.max);
    const count = mn + Math.floor(Math.random() * (mx - mn + 1));
    for (let i = 0; i < count; i++) { items.push(d); correctAmount += d.val; }
  }
  if (items.length === 0) {
    const avail = DENOMS.filter(d => ranges[d.val].max > 0);
    if (avail.length > 0) {
      const d = avail[Math.floor(Math.random() * avail.length)];
      items.push(d); correctAmount += d.val;
    }
  }
  return items;
}

let currentItems = [];

/* ===== コイン描画 ===== */
function renderCoins(items) {
  const area = document.getElementById('coins-area');
  area.innerHTML = '';

  const areaW = area.clientWidth  || 360;
  const areaH = area.clientHeight || 280;

  if (viewMode === 'scattered') {
    area.className = 'scattered';

    // コインサイズ: 枚数が多いほど小さく（最小40, 最大76）
    const n = Math.max(items.length, 1);
    const rawSize = Math.sqrt((areaW * areaH * 0.55) / n);
    const coinSize = Math.max(40, Math.min(76, Math.round(rawSize)));
    const noteW = Math.round(coinSize * 1.7);
    const noteH = Math.round(coinSize * 0.98);

    const placed = [];
    const shuffled = [...items].sort(() => Math.random() - 0.5);

    for (const d of shuffled) {
      const isNote = d.type === 'note';
      const w = isNote ? noteW : coinSize;
      const h = isNote ? noteH : coinSize;
      let x, y, tries = 0;
      do {
        x = Math.random() * (areaW - w - 6) + 3;
        y = Math.random() * (areaH - h - 6) + 3;
        tries++;
      } while (tries < 100 && placed.some(p =>
        Math.abs(p.x - x) < w * 0.68 && Math.abs(p.y - y) < h * 0.68
      ));
      placed.push({ x, y });

      const el = document.createElement('div');
      el.className = 'coin-item';
      const rot = (Math.random() - 0.5) * 24;
      el.style.cssText = `left:${x}px;top:${y}px;width:${w}px;height:${h}px;transform:rotate(${rot}deg)`;
      el.innerHTML = isNote ? noteSVG(d.val, w, h) : coinSVG(d.val, coinSize);
      area.appendChild(el);
    }

  } else {
    // 整列: 2列グリッド
    area.className = 'aligned';

    // 金種でグループ化 → 大きい順ソート
    const groups = {};
    for (const d of items) {
      if (!groups[d.val]) groups[d.val] = { denom: d, count: 0 };
      groups[d.val].count++;
    }
    const sorted = Object.values(groups).sort((a, b) => b.denom.val - a.denom.val);

    // コインサイズ: 行数に応じて調整
    const rows = sorted.length;
    const coinSize = Math.max(36, Math.min(58, Math.floor((areaH - 20) / Math.ceil(rows / 2) - 14)));
    const noteW = Math.round(coinSize * 1.65);
    const noteH = Math.round(coinSize * 0.95);

    for (const g of sorted) {
      const row = document.createElement('div');
      row.className = 'align-row';

      const lbl = document.createElement('div');
      lbl.className = 'align-label';
      lbl.textContent = g.denom.label;
      row.appendChild(lbl);

      const isNote = g.denom.type === 'note';
      for (let i = 0; i < g.count; i++) {
        const el = document.createElement('div');
        el.innerHTML = isNote
          ? noteSVG(g.denom.val, noteW, noteH)
          : coinSVG(g.denom.val, coinSize);
        row.appendChild(el);
      }
      area.appendChild(row);
    }
  }
}

function newQuestion() {
  currentAnswer = ''; answered = false;
  document.getElementById('answer-text').textContent = '　';
  document.getElementById('next-btn').classList.remove('show');
  currentItems = generateQuestion();
  // DOMサイズが確定してからrenderするため少しだけ待つ
  requestAnimationFrame(() => renderCoins(currentItems));
}

function setView(mode) {
  viewMode = mode;
  document.getElementById('btn-scatter').classList.toggle('active', mode === 'scattered');
  document.getElementById('btn-align').classList.toggle('active',  mode === 'aligned');
  renderCoins(currentItems);
}

/* ===== テンキー ===== */
function numInput(d) {
  if (answered || currentAnswer.length >= 6) return;
  currentAnswer += d;
  document.getElementById('answer-text').textContent = currentAnswer;
}
function numDel() {
  if (answered) return;
  currentAnswer = currentAnswer.slice(0, -1);
  document.getElementById('answer-text').textContent = currentAnswer || '　';
}

/* ===== 正誤判定 ===== */
function checkAnswer() {
  if (answered || currentAnswer === '') return;
  answered = true;
  if (parseInt(currentAnswer, 10) === correctAmount) {
    showMaru(); playCorrect();
    document.getElementById('next-btn').classList.add('show');
  } else {
    playWrong();
    setTimeout(() => {
      answered = false; currentAnswer = '';
      document.getElementById('answer-text').textContent = '　';
    }, 700);
  }
}
function nextQuestion() { newQuestion(); }

/* ===== フィードバック ===== */
function showMaru() {
  const el = document.getElementById('feedback-maru');
  el.className = ''; void el.offsetWidth; el.className = 'show';
  setTimeout(() => { el.className = ''; }, 1600);
}

/* ===== 音 ===== */
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;
function getACtx() { if (!audioCtx) audioCtx = new AudioCtx(); return audioCtx; }

function playCorrect() {
  const ctx = getACtx(), t = ctx.currentTime;
  [[880,t,0.18],[1100,t+0.22,0.18]].forEach(([freq,start,dur]) => {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'sine'; o.frequency.value = freq;
    g.gain.setValueAtTime(0.001, start);
    g.gain.linearRampToValueAtTime(0.28, start + 0.03);
    g.gain.exponentialRampToValueAtTime(0.001, start + dur);
    o.connect(g); g.connect(ctx.destination);
    o.start(start); o.stop(start + dur + 0.05);
  });
}
function playWrong() {
  const ctx = getACtx(), t = ctx.currentTime;
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.type = 'sawtooth';
  o.frequency.setValueAtTime(480, t);
  o.frequency.exponentialRampToValueAtTime(110, t + 0.5);
  g.gain.setValueAtTime(0.001, t);
  g.gain.linearRampToValueAtTime(0.2, t + 0.04);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.5);
  o.connect(g); g.connect(ctx.destination);
  o.start(t); o.stop(t + 0.55);
}

/* ===== 設定画面 ===== */
function openSettings() {
  buildSettingsUI();
  document.getElementById('main-screen').classList.remove('active');
  document.getElementById('settings-screen').classList.add('active');
}
function closeSettings() {
  document.getElementById('settings-screen').classList.remove('active');
  document.getElementById('main-screen').classList.add('active');
  newQuestion();
}

function buildSettingsUI() {
  const container = document.getElementById('settings-rows');
  container.innerHTML = '';
  for (const d of DENOMS) {
    const isNote = d.type === 'note';
    const thumb = isNote ? noteSVG(d.val, 46, 28) : coinSVG(d.val, 30);
    const r = ranges[d.val];
    const row = document.createElement('div');
    row.className = 'setting-row';
    row.innerHTML = `
      <div class="setting-label">${thumb}<span>${d.label}</span></div>
      <div class="setting-controls">
        <span class="range-label">最小</span>
        <button class="step-btn" onclick="changeRange(${d.val},'min',-1)">－</button>
        <div class="count-val" id="rmin-${d.val}">${r.min}</div>
        <button class="step-btn" onclick="changeRange(${d.val},'min',+1)">＋</button>
        <span class="range-label" style="margin-left:5px">最大</span>
        <button class="step-btn" onclick="changeRange(${d.val},'max',-1)">－</button>
        <div class="count-val" id="rmax-${d.val}">${r.max}</div>
        <button class="step-btn" onclick="changeRange(${d.val},'max',+1)">＋</button>
      </div>`;
    container.appendChild(row);
  }
}

function changeRange(val, which, delta) {
  const r = ranges[val];
  if (which === 'min') {
    r.min = Math.max(0, Math.min(10, r.min + delta));
    // 最小が最大を超えたら最大も一緒に動かす
    if (r.min > r.max) r.max = r.min;
  } else {
    r.max = Math.max(r.min, Math.min(10, r.max + delta));
  }
  document.getElementById(`rmin-${val}`).textContent = r.min;
  document.getElementById(`rmax-${val}`).textContent = r.max;
}

/* ===== 初期化 ===== */
window.addEventListener('load', () => {
  // ちょっと待ってからレンダリング（iOS Safariのレイアウト確定後）
  setTimeout(() => newQuestion(), 50);
});
window.addEventListener('resize', () => {
  if (!answered) renderCoins(currentItems);
});
</script>
