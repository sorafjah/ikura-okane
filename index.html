<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>お金はいくら？</title>
<style>
  :root {
    --bg: #fdf6e3;
    --surface: #fff8e7;
    --border: #e8d5a3;
    --text: #3d2c00;
    --sub: #8a6f3a;
    --correct: #4caf50;
    --accent: #e8913a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'BIZ UDPGothic', 'BIZ UDGothic', sans-serif;
    background: var(--bg);
    height: 100vh;
    overflow: hidden;
    touch-action: manipulation;
  }

  .screen { display: none; width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; }
  .screen.active { display: flex; }

  /* ===== MAIN SCREEN ===== */
  #main-screen {
    flex-direction: column;
    align-items: center;
    padding: 8px 10px 6px;
    gap: 6px;
  }

  #view-toggle {
    display: flex; gap: 8px; flex-shrink: 0;
  }
  .toggle-btn {
    padding: 5px 16px; border-radius: 20px;
    border: 2px solid var(--border); background: white;
    font-size: 14px; font-weight: bold; color: var(--sub);
    cursor: pointer; font-family: inherit;
    -webkit-tap-highlight-color: transparent;
  }
  .toggle-btn.active { background: var(--accent); border-color: var(--accent); color: white; }

  /* coins area */
  #coins-area {
    width: 100%; flex: 1;
    background: var(--surface);
    border: 2px solid var(--border);
    border-radius: 20px;
    position: relative; overflow: hidden; min-height: 0;
  }
  #coins-area.aligned {
    display: flex; flex-direction: column;
    justify-content: center;
    padding: 12px 16px; gap: 8px; overflow-y: auto;
  }
  #coins-area.scattered { display: block; }

  .align-row {
    display: flex; align-items: center;
    gap: 6px; flex-wrap: wrap;
  }
  .align-label {
    font-size: 13px; color: var(--sub);
    min-width: 42px; text-align: right; flex-shrink: 0;
  }
  .coin-item { position: absolute; user-select: none; }
  .coin-item svg { display: block; }

  /* bottom */
  #bottom-area {
    width: 100%; display: flex;
    align-items: center; justify-content: center;
    gap: 16px; flex-shrink: 0; padding: 0 4px;
  }

  #answer-block {
    display: flex; flex-direction: column;
    align-items: center; gap: 8px;
  }
  #answer-row {
    display: flex; align-items: baseline; gap: 4px;
  }
  #answer-display {
    font-size: 42px; font-weight: bold; color: var(--text);
    border-bottom: 3px solid var(--border);
    padding: 2px 10px; min-width: 130px;
    text-align: center; min-height: 54px; line-height: 1.2;
  }
  #yen-label {
    font-size: 28px; font-weight: bold; color: var(--sub);
  }

  #numpad {
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 5px; width: min(210px, 58vw); flex-shrink: 0;
  }
  .num-btn {
    background: white; border: 2px solid var(--border);
    border-radius: 10px; font-size: 18px; font-weight: bold;
    color: var(--text); padding: 9px 0; cursor: pointer;
    -webkit-tap-highlight-color: transparent; font-family: inherit;
  }
  .num-btn:active { background: #fff0cc; transform: scale(0.92); }
  .num-btn.del { font-size: 15px; color: var(--sub); }
  .num-btn.enter {
    background: var(--accent); color: white;
    border-color: var(--accent); font-size: 13px; font-weight: bold;
  }
  .num-btn.enter:active { background: #c97020; }

  #next-btn {
    display: none; padding: 9px 26px;
    background: var(--accent); color: white;
    border: none; border-radius: 22px;
    font-size: 16px; font-weight: bold;
    cursor: pointer; font-family: inherit;
  }
  #next-btn.show { display: block; }

  /* gear */
  #gear-btn {
    position: fixed; bottom: 12px; right: 12px;
    width: 36px; height: 36px;
    background: none; border: none; cursor: pointer;
    opacity: 0.22; padding: 0;
    -webkit-tap-highlight-color: transparent; z-index: 100;
  }
  #gear-btn:hover { opacity: 0.5; }

  /* feedback: 〇 text only, big, pop then fade */
  #feedback {
    position: fixed; top: 0; left: 0;
    width: 100vw; height: 100vh;
    display: flex; align-items: center; justify-content: center;
    pointer-events: none; z-index: 200;
  }
  #feedback-maru {
    font-size: 200px; line-height: 1;
    color: var(--correct);
    opacity: 0; transform: scale(0.3);
  }
  #feedback-maru.show {
    animation: pop-maru 1.5s ease forwards;
  }
  @keyframes pop-maru {
    0%   { opacity: 0; transform: scale(0.3); }
    18%  { opacity: 1; transform: scale(1.3); }
    50%  { opacity: 1; transform: scale(1.0); }
    75%  { opacity: 1; transform: scale(1.08); }
    100% { opacity: 0; transform: scale(2.4); }
  }

  /* ===== SETTINGS ===== */
  #settings-screen {
    flex-direction: column; align-items: center;
    padding: 20px 14px; gap: 14px; overflow-y: auto;
  }
  #settings-title { font-size: 20px; font-weight: bold; color: var(--text); }
  .settings-card {
    width: 100%; max-width: 500px;
    background: var(--surface);
    border: 2px solid var(--border); border-radius: 16px;
    padding: 14px 16px;
  }
  .settings-card h3 { font-size: 13px; color: var(--sub); margin-bottom: 10px; }

  .setting-row {
    display: flex; align-items: center;
    justify-content: space-between;
    padding: 7px 0; border-bottom: 1px solid var(--border); gap: 8px;
  }
  .setting-row:last-child { border-bottom: none; }
  .setting-label {
    display: flex; align-items: center;
    gap: 7px; font-size: 14px; font-weight: bold; color: var(--text);
  }
  .setting-controls {
    display: flex; align-items: center; gap: 4px;
  }
  .step-btn {
    width: 30px; height: 30px; border-radius: 50%;
    border: 2px solid var(--border); background: white;
    font-size: 17px; cursor: pointer; font-family: inherit; color: var(--text);
    display: flex; align-items: center; justify-content: center;
    -webkit-tap-highlight-color: transparent;
  }
  .step-btn:active { background: #fff0cc; }
  .range-label {
    font-size: 13px; color: var(--sub); margin: 0 4px; white-space: nowrap;
  }
  .count-val {
    font-size: 16px; font-weight: bold; color: var(--text);
    min-width: 22px; text-align: center;
  }

  #back-btn {
    padding: 11px 44px;
    background: var(--accent); color: white;
    border: none; border-radius: 22px;
    font-size: 17px; font-weight: bold;
    cursor: pointer; font-family: inherit;
  }
</style>
</head>
<body>

<!-- MAIN -->
<div id="main-screen" class="screen active">
  <div id="view-toggle">
    <button class="toggle-btn active" id="btn-scatter" onclick="setView('scattered')">バラバラ</button>
    <button class="toggle-btn"        id="btn-align"   onclick="setView('aligned')">せいれつ</button>
  </div>

  <div id="coins-area" class="scattered"></div>

  <div id="bottom-area">
    <div id="numpad">
      <button class="num-btn" onclick="numInput('7')">7</button>
      <button class="num-btn" onclick="numInput('8')">8</button>
      <button class="num-btn" onclick="numInput('9')">9</button>
      <button class="num-btn" onclick="numInput('4')">4</button>
      <button class="num-btn" onclick="numInput('5')">5</button>
      <button class="num-btn" onclick="numInput('6')">6</button>
      <button class="num-btn" onclick="numInput('1')">1</button>
      <button class="num-btn" onclick="numInput('2')">2</button>
      <button class="num-btn" onclick="numInput('3')">3</button>
      <button class="num-btn del"   onclick="numDel()">⌫</button>
      <button class="num-btn"       onclick="numInput('0')">0</button>
      <button class="num-btn enter" onclick="checkAnswer()">こたえる</button>
    </div>

    <div id="answer-block">
      <div id="answer-row">
        <div id="answer-display"><span id="answer-text">　</span></div>
        <div id="yen-label">円</div>
      </div>
      <button id="next-btn" onclick="nextQuestion()">つぎへ</button>
    </div>
  </div>
</div>

<!-- SETTINGS -->
<div id="settings-screen" class="screen">
  <div id="settings-title">⚙️ せってい</div>
  <div class="settings-card">
    <h3>金種ごとに「最小枚数」と「最大枚数」を設定</h3>
    <div id="settings-rows"></div>
  </div>
  <button id="back-btn" onclick="closeSettings()">もどる</button>
</div>

<!-- Gear -->
<button id="gear-btn" onclick="openSettings()">
  <svg viewBox="0 0 24 24" fill="none" stroke="#666" stroke-width="1.8" width="36" height="36">
    <circle cx="12" cy="12" r="3"/>
    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
  </svg>
</button>

<!-- Feedback -->
<div id="feedback">
  <div id="feedback-maru">〇</div>
</div>

<script>
const DENOMS = [
  { val: 1,    label: '1円',    type: 'coin' },
  { val: 5,    label: '5円',    type: 'coin' },
  { val: 10,   label: '10円',   type: 'coin' },
  { val: 50,   label: '50円',   type: 'coin' },
  { val: 100,  label: '100円',  type: 'coin' },
  { val: 500,  label: '500円',  type: 'coin' },
  { val: 1000, label: '1000円', type: 'note' },
];

// min〜max (デフォルト: 10円×0〜4, 50円×0〜2, 100円×0〜3, 500円×0〜1)
let ranges = {
  1:    { min: 0, max: 0 },
  5:    { min: 0, max: 0 },
  10:   { min: 0, max: 4 },
  50:   { min: 0, max: 2 },
  100:  { min: 0, max: 3 },
  500:  { min: 0, max: 1 },
  1000: { min: 0, max: 0 },
};

let currentAnswer = '';
let correctAmount = 0;
let answered = false;
let viewMode = 'scattered';

// ===== SVG =====
function coinSVG(val, size) {
  // 1円: グレー, 5円: 金色, 10円: 赤銅色, 50/100/500: シルバー
  const C = {
    1:   { bg:'#b2b2b2', inner:'#d0d0d0', rim:'#888', text:'1',   hole:false },
    5:   { bg:'#c8a84b', inner:'#e0c060', rim:'#a07830', text:'5',   hole:true  },
    10:  { bg:'#b87333', inner:'#d4946a', rim:'#8a4820', text:'10',  hole:false },
    50:  { bg:'#b0b0b0', inner:'#d0d0d0', rim:'#808080', text:'50',  hole:true  },
    100: { bg:'#a8a8a8', inner:'#c8c8c8', rim:'#686868', text:'100', hole:false },
    500: { bg:'#a0a8b0', inner:'#c0c8d0', rim:'#7080a0', text:'500', hole:false },
  };
  const c = C[val];
  const r = size / 2;
  const ts = val >= 100 ? size * 0.21 : val >= 10 ? size * 0.25 : size * 0.30;
  const hole = c.hole
    ? `<circle cx="${r}" cy="${r}" r="${size*0.11}" fill="#fff8e7" stroke="${c.rim}" stroke-width="1.2"/>`
    : '';
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" xmlns="http://www.w3.org/2000/svg">
    <circle cx="${r}" cy="${r}" r="${r-1}" fill="${c.rim}"/>
    <circle cx="${r}" cy="${r}" r="${r-3}" fill="${c.bg}"/>
    <circle cx="${r}" cy="${r}" r="${r-5}" fill="${c.inner}" opacity="0.55"/>
    ${hole}
    <text x="${r}" y="${r + ts*0.42}" text-anchor="middle" font-size="${ts}" font-weight="bold" fill="${c.rim}" font-family="BIZ UDPGothic,sans-serif">${c.text}</text>
  </svg>`;
}

function noteSVG(val, w, h) {
  // 1000円: ベージュ
  const bg = '#e8d9b8'; const border = '#b09060'; const inner = '#f5ead0';
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">
    <rect x="1" y="1" width="${w-2}" height="${h-2}" rx="5" fill="${border}"/>
    <rect x="3" y="3" width="${w-6}" height="${h-6}" rx="4" fill="${bg}"/>
    <rect x="6" y="6" width="${w-12}" height="${h-12}" rx="3" fill="${inner}" opacity="0.55"/>
    <circle cx="${w*0.5}" cy="${h*0.5}" r="${h*0.28}" fill="${border}" opacity="0.18"/>
    <text x="${w*0.5}" y="${h*0.59}" text-anchor="middle" font-size="${h*0.33}" font-weight="bold" fill="${border}" font-family="BIZ UDPGothic,sans-serif">1000</text>
  </svg>`;
}

// ===== QUESTION =====
function generateQuestion() {
  correctAmount = 0;
  const items = [];
  for (const d of DENOMS) {
    const r = ranges[d.val];
    if (r.max === 0 && r.min === 0) continue;
    const mn = Math.min(r.min, r.max);
    const mx = Math.max(r.min, r.max);
    const count = mn + Math.floor(Math.random() * (mx - mn + 1));
    for (let i = 0; i < count; i++) { items.push(d); correctAmount += d.val; }
  }
  if (items.length === 0) {
    const avail = DENOMS.filter(d => ranges[d.val].max > 0);
    if (avail.length > 0) {
      const d = avail[Math.floor(Math.random() * avail.length)];
      items.push(d); correctAmount += d.val;
    }
  }
  return items;
}

let currentItems = [];

function renderCoins(items) {
  const area = document.getElementById('coins-area');
  area.innerHTML = '';

  const areaW = area.clientWidth  || 360;
  const areaH = area.clientHeight || 300;

  if (viewMode === 'scattered') {
    area.className = 'scattered';
    const coinSize = Math.max(48, Math.min(78, Math.floor(areaH / 4.2)));
    const noteW = Math.floor(coinSize * 1.7); const noteH = Math.floor(coinSize);
    const placed = [];
    const shuffled = [...items].sort(() => Math.random() - 0.5);
    for (const d of shuffled) {
      const isNote = d.type === 'note';
      const w = isNote ? noteW : coinSize;
      const h = isNote ? noteH : coinSize;
      let x, y, tries = 0;
      do {
        x = Math.random() * (areaW - w - 8) + 4;
        y = Math.random() * (areaH - h - 8) + 4;
        tries++;
      } while (tries < 90 && placed.some(p =>
        Math.abs(p.x - x) < w * 0.70 && Math.abs(p.y - y) < h * 0.70
      ));
      placed.push({ x, y });
      const el = document.createElement('div');
      el.className = 'coin-item';
      el.style.cssText = `left:${x}px;top:${y}px;width:${w}px;height:${h}px;transform:rotate(${(Math.random()-0.5)*26}deg)`;
      el.innerHTML = isNote ? noteSVG(d.val, w, h) : coinSVG(d.val, coinSize);
      area.appendChild(el);
    }
  } else {
    area.className = 'aligned';
    const coinSize = Math.max(40, Math.min(64, Math.floor(areaH / 5.5)));
    const noteW = Math.floor(coinSize * 1.7); const noteH = Math.floor(coinSize);
    const groups = {};
    for (const d of items) {
      if (!groups[d.val]) groups[d.val] = { denom: d, count: 0 };
      groups[d.val].count++;
    }
    for (const g of Object.values(groups).sort((a,b) => b.denom.val - a.denom.val)) {
      const row = document.createElement('div');
      row.className = 'align-row';
      const lbl = document.createElement('div');
      lbl.className = 'align-label'; lbl.textContent = g.denom.label;
      row.appendChild(lbl);
      const isNote = g.denom.type === 'note';
      for (let i = 0; i < g.count; i++) {
        const el = document.createElement('div');
        el.innerHTML = isNote ? noteSVG(g.denom.val, noteW, noteH) : coinSVG(g.denom.val, coinSize);
        row.appendChild(el);
      }
      area.appendChild(row);
    }
  }
}

function newQuestion() {
  currentAnswer = ''; answered = false;
  document.getElementById('answer-text').textContent = '　';
  document.getElementById('next-btn').classList.remove('show');
  currentItems = generateQuestion();
  renderCoins(currentItems);
}

function setView(mode) {
  viewMode = mode;
  document.getElementById('btn-scatter').classList.toggle('active', mode==='scattered');
  document.getElementById('btn-align').classList.toggle('active',  mode==='aligned');
  renderCoins(currentItems);
}

// ===== NUMPAD =====
function numInput(d) {
  if (answered || currentAnswer.length >= 6) return;
  currentAnswer += d;
  document.getElementById('answer-text').textContent = currentAnswer;
}
function numDel() {
  if (answered) return;
  currentAnswer = currentAnswer.slice(0,-1);
  document.getElementById('answer-text').textContent = currentAnswer || '　';
}

// ===== CHECK =====
function checkAnswer() {
  if (answered || currentAnswer === '') return;
  answered = true;
  if (parseInt(currentAnswer, 10) === correctAmount) {
    showMaru(); playCorrect();
    document.getElementById('next-btn').classList.add('show');
  } else {
    playWrong();
    setTimeout(() => {
      answered = false; currentAnswer = '';
      document.getElementById('answer-text').textContent = '　';
    }, 700);
  }
}
function nextQuestion() { newQuestion(); }

// ===== FEEDBACK =====
function showMaru() {
  const el = document.getElementById('feedback-maru');
  el.className = ''; void el.offsetWidth; el.className = 'show';
  setTimeout(() => { el.className = ''; }, 1600);
}

// ===== AUDIO =====
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;
function getACtx() { if (!audioCtx) audioCtx = new AudioCtx(); return audioCtx; }

function playCorrect() {
  const ctx = getACtx(), t = ctx.currentTime;
  [[880,t,0.18],[1100,t+0.22,0.18]].forEach(([freq,start,dur])=>{
    const o=ctx.createOscillator(), g=ctx.createGain();
    o.type='sine'; o.frequency.value=freq;
    g.gain.setValueAtTime(0.001,start);
    g.gain.linearRampToValueAtTime(0.28,start+0.03);
    g.gain.exponentialRampToValueAtTime(0.001,start+dur);
    o.connect(g); g.connect(ctx.destination);
    o.start(start); o.stop(start+dur+0.05);
  });
}
function playWrong() {
  const ctx = getACtx(), t = ctx.currentTime;
  const o=ctx.createOscillator(), g=ctx.createGain();
  o.type='sawtooth';
  o.frequency.setValueAtTime(480,t);
  o.frequency.exponentialRampToValueAtTime(110,t+0.5);
  g.gain.setValueAtTime(0.001,t);
  g.gain.linearRampToValueAtTime(0.2,t+0.04);
  g.gain.exponentialRampToValueAtTime(0.001,t+0.5);
  o.connect(g); g.connect(ctx.destination);
  o.start(t); o.stop(t+0.55);
}

// ===== SETTINGS =====
function openSettings() {
  buildSettingsUI();
  document.getElementById('main-screen').classList.remove('active');
  document.getElementById('settings-screen').classList.add('active');
}
function closeSettings() {
  document.getElementById('settings-screen').classList.remove('active');
  document.getElementById('main-screen').classList.add('active');
  newQuestion();
}

function buildSettingsUI() {
  const container = document.getElementById('settings-rows');
  container.innerHTML = '';
  for (const d of DENOMS) {
    const isNote = d.type === 'note';
    const thumb = isNote ? noteSVG(d.val,48,29) : coinSVG(d.val,32);
    const r = ranges[d.val];
    const row = document.createElement('div');
    row.className = 'setting-row';
    row.innerHTML = `
      <div class="setting-label">${thumb}<span>${d.label}</span></div>
      <div class="setting-controls">
        <span class="range-label">最小</span>
        <button class="step-btn" onclick="changeRange(${d.val},'min',-1)">－</button>
        <div class="count-val" id="rmin-${d.val}">${r.min}</div>
        <button class="step-btn" onclick="changeRange(${d.val},'min',+1)">＋</button>
        <span class="range-label" style="margin-left:6px">最大</span>
        <button class="step-btn" onclick="changeRange(${d.val},'max',-1)">－</button>
        <div class="count-val" id="rmax-${d.val}">${r.max}</div>
        <button class="step-btn" onclick="changeRange(${d.val},'max',+1)">＋</button>
      </div>`;
    container.appendChild(row);
  }
}

function changeRange(val, which, delta) {
  const r = ranges[val];
  if (which === 'min') {
    r.min = Math.max(0, Math.min(r.max, r.min + delta));
  } else {
    r.max = Math.max(r.min, Math.min(10, r.max + delta));
  }
  document.getElementById(`rmin-${val}`).textContent = r.min;
  document.getElementById(`rmax-${val}`).textContent = r.max;
}

window.addEventListener('load', () => newQuestion());
window.addEventListener('resize', () => { if (!answered) renderCoins(currentItems); });
</script>
</body>
</html>
